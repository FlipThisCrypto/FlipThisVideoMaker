version: 1
providers:
  - id: mock-image
    kind: mock
    enabled: true
  - id: mock-tts
    kind: mock
    enabled: true
  - id: mock-video
    kind: mock
    enabled: true
  - id: target-image-cli
    kind: cli
    enabled: false
    command: []
    health_command: []
    model: administrator-configured
    timeout_seconds: 1800
    max_download_mb: 100
  - id: luma-ray
    kind: luma
    enabled: false
    endpoint: https://agents.lumalabs.ai/v1
    model: ray-3.2
    api_key_env: LUMA_AGENTS_API_KEY
    timeout_seconds: 900
    poll_interval_seconds: 2
    max_download_mb: 2048
    max_inline_image_mb: 20
  - id: ltx-video-pro
    kind: ltx
    enabled: false
    endpoint: https://api.ltx.video
    model: ltx-2-3-pro
    api_key_env: LTXV_API_KEY
    timeout_seconds: 900
    poll_interval_seconds: 5
    max_download_mb: 2048
    max_inline_image_mb: 7
  - id: wan22-flf-gpu1
    kind: comfyui_wan_flf
    enabled: true
    endpoint: http://127.0.0.1:8189
    workflow_template: ./comfyui-workflows/wan2.2-flf-api-v1.json
    model: wan2.2-i2v-a14b-fp8
    gpu_assignment: gpu1
    timeout_seconds: 7200
    poll_interval_seconds: 2
    max_download_mb: 4096
  - id: rife-local
    kind: rife
    enabled: false
    python: /opt/practical-rife/.venv/bin/python
    script: /opt/practical-rife/inference_video.py
    model_directory: /opt/practical-rife/train_log
    timeout_seconds: 1800
  - id: latentsync-local
    kind: latentsync
    enabled: false
    model: LatentSync-1.5
    python: /opt/latentsync/.venv/bin/python
    repository_directory: /opt/latentsync
    unet_config_path: /opt/latentsync/configs/unet/stage2.yaml
    checkpoint_path: /opt/latentsync/checkpoints/latentsync_unet.pt
    syncnet_checkpoint_path: /opt/latentsync/checkpoints/auxiliary/syncnet_v2.model
    inference_steps: 20
    guidance_scale: 1.5
    enable_deepcache: true
    timeout_seconds: 1800
  - id: comfyui-local
    kind: comfyui
    enabled: false
    endpoint: http://127.0.0.1:8188
    workflow_template_directory: ./config/comfyui-workflows
  - id: wangp-local
    kind: wangp
    enabled: false
    python: /opt/wangp/.venv/bin/python
    script: /opt/wangp/wgp.py
  - id: ollama-local
    kind: ollama
    enabled: false
    endpoint: http://127.0.0.1:11434
    model: qwen3:8b
  - id: openai-compatible-local
    kind: openai_compatible
    enabled: false
    endpoint: http://127.0.0.1:8001
    model: local-model
    api_key_env: FTVM_LOCAL_LLM_API_KEY
